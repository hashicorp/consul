# Single-node Consul dev agent on the fixed :8500 port.
# Connect (service mesh) is enabled by default in `-dev` mode — required here.
services:
  consul:
    image: ${CONSUL_IMAGE:-hashicorp/consul:1.20}
    environment:
      # Only used when CONSUL_IMAGE is an Enterprise image (EDITION=ent runs).
      - CONSUL_LICENSE=${CONSUL_LICENSE:-}
    command: agent -dev -client 0.0.0.0 -node node-primary -dns-port=-1
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 3s
      timeout: 2s
      retries: 20
