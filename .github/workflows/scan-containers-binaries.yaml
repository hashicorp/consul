# Manually-triggered workflow that builds every release artifact (binaries,
# packages, and container images) for the latest commit on the selected branch,
# then runs the HashiCorp security scanner against the repository source, the
# built binaries, and the built container images.
#
# The scanning mirrors the CRT security-scan reusables
# (.github/workflows/reusable-crt-security-scan-binaries.yml and
# reusable-crt-security-scan-containers.yml): discover the built artifacts, then
# fan out a matrix that scans each binary and each container image, gated on the
# artifacts actually existing (scan-binaries ~ security-scan-binaries,
# scan-containers ~ security-scan-containers).
#
# Key differences, because those reusables target HashiCorp's CRT pipeline:
#   * They pull pre-built artifacts from Artifactory (via bob) for a prior build;
#     we TRIGGER build.yml and scan the artifacts it uploads to this run.
#   * They run the scanner binary on self-hosted runners (Vault + bob); we run
#     the scanner as a local action after cloning the private
#     hashicorp/security-scanner repo with PRODSEC_SCANNER_READ_ONLY, on GitHub-hosted runners.
#   * Binary/container config is loaded from .release/security-scan.hcl, with
#     local_daemon enabled in a temporary copy for locally built container images.
#     Repository scans continue to use scan.hcl at the repository root.
#   * CRT-only jobs (IBM Twistlock, UST publishing, Datadog metrics) are omitted
#     as they require internal infrastructure that does not apply here.
#
# Trigger it from the Actions tab via "Run workflow" and pick any branch. The
# build runs against that branch's latest commit and the scan jobs consume its
# artifacts in the same run. Scan jobs fail on unsuppressed findings, while SARIF
# results are still uploaded for failed scans. The results check and readable CVE
# list, including package versions and recommended fixes, are defined here and
# shared with YAML aliases, without helper scripts.
name: Scan Binaries and Containers

on:
  workflow_dispatch:

# Only allow one run of this workflow per ref at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for the discover-artifacts job to list this run's artifacts, and
  # for the scan jobs to download them, via the GitHub Actions API.
  actions: read
  # Required by github/codeql-action/upload-sarif to upload SARIF results
  security-events: write

jobs:
  # 1. Build every artifact for the triggering branch's latest commit. build.yml
  #    is invoked as a reusable workflow (it exposes a `workflow_call` trigger),
  #    so all of its jobs run under THIS run's id and their uploaded artifacts
  #    (binary zips, rpm/deb packages, and container image tarballs) are attached
  #    to this run -- which is what lets discover-artifacts below enumerate them
  #    and the scan jobs download them.
  build:
    uses: ./.github/workflows/build.yml

  # 2. Resolve the Go toolchain version the scanner uses for go_modules analysis.
  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml

  # 3. Scan the repository source tree. This does not need the build artifacts,
  #    so it runs in parallel with the build.
  scan-repository:
    name: Scan repository
    needs: [get-go-version]
    runs-on: ubuntu-latest
    # Skip on forks, which lack the PRODSEC_SCANNER_READ_ONLY secret.
    if: github.repository == 'hashicorp/consul'
    steps:
      - name: Checkout
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      # hashicorp/security-scanner is a private repo, so we check it out with a 
      # read-only token and run it as a local action.
      - name: Clone Security Scanner repo
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          repository: hashicorp/security-scanner
          token: ${{ secrets.PRODSEC_SCANNER_READ_ONLY }}
          path: security-scanner
          ref: main

      - name: Scan repository
        id: scan
        uses: ./security-scanner
        with:
          sarif-profile: github
          fail-on-detection: true
          repository: "$PWD"
          # Repository config is auto-loaded from scan.hcl at the repo root

      - &check-scan-results
        name: Check scan results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sarif_file="${GITHUB_WORKSPACE}/results.sarif"
          if [[ ! -s "${sarif_file}" ]]; then
            echo "::error::SARIF report is missing or empty: ${sarif_file}" >&2
            exit 1
          fi

          jq . "${sarif_file}"

          # JSON scans can exit successfully even when SARIF contains findings.
          finding_count=$(jq -ers '
            if length != 1 then
              error("Expected exactly one SARIF report")
            else
              .[0]
            end |
            if type != "object" then
              error("Expected the SARIF report to be an object")
            elif .version != "2.1.0" or (.runs | type) != "array" then
              error("Expected a SARIF 2.1.0 report with a runs array")
            else
              [
                .runs[] |
                if type != "object" then
                  error("Expected each SARIF run to be an object")
                elif has("results") and (.results | type) != "array" then
                  error("Expected SARIF results to be an array")
                else
                  .results[]?
                end
              ] | length
            end
          ' "${sarif_file}")

          if [[ "${finding_count}" -gt 0 ]]; then
            echo "::error::Security scan found ${finding_count} unsuppressed finding(s). See the SARIF results for details." >&2
            exit 1
          fi

          echo "Security scan found no unsuppressed findings."

      - &list-cves
        name: List CVEs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sarif_file="${GITHUB_WORKSPACE}/results.sarif"
          if [[ ! -s "${sarif_file}" ]]; then
            echo "::error::SARIF report is missing or empty: ${sarif_file}" >&2
            exit 1
          fi

          jq -rs '
            def finding_rule($run; $finding):
              ($run.tool.driver.rules // []) as $rules |
              ($finding.ruleId // $finding.rule.id) as $rule_id |
              if ($rules | type) != "array" then
                error("Expected SARIF rules to be an array")
              else
                first($rules[] | select($rule_id != null and .id == $rule_id)) //
                (
                  if $finding.ruleIndex == null then
                    {}
                  elif ($finding.ruleIndex | type) != "number" or
                       $finding.ruleIndex < 0 or
                       ($finding.ruleIndex | floor) != $finding.ruleIndex then
                    error("Expected SARIF ruleIndex to be a non-negative integer")
                  elif $finding.ruleIndex >= ($rules | length) then
                    error("SARIF ruleIndex is outside the rules array")
                  else
                    $rules[$finding.ruleIndex]
                  end
                )
              end;

            def reported_text($properties; $key):
              $properties[$key] as $value |
              if $value == null then
                null
              elif ($value | type) != "string" then
                error("Expected SARIF \($key) to be a string")
              else
                $value | gsub("\\s+"; " ") | sub("^ "; "") | sub(" $"; "") |
                if length == 0 then null else . end
              end;

            def finding_properties($rule; $finding):
              ($rule.properties | if . == null then {} else . end) as $rule_properties |
              ($finding.properties | if . == null then {} else . end) as $finding_properties |
              if ($rule_properties | type) != "object" or
                 ($finding_properties | type) != "object" then
                error("Expected SARIF properties to be an object")
              else
                # Do not reuse a rule fix for another package or version.
                if ($finding_properties | has("package")) and
                   reported_text($finding_properties; "package") != reported_text($rule_properties; "package") then
                  ($rule_properties | del(.package_version, .recommended_fix_version)) + $finding_properties
                elif ($finding_properties | has("package_version")) and
                     reported_text($finding_properties; "package_version") != reported_text($rule_properties; "package_version") then
                  ($rule_properties | del(.recommended_fix_version)) + $finding_properties
                else
                  $rule_properties + $finding_properties
                end
              end;

            if length != 1 then
              error("Expected exactly one SARIF report")
            else
              .[0]
            end |
            if type != "object" then
              error("Expected the SARIF report to be an object")
            elif .version != "2.1.0" or (.runs | type) != "array" then
              error("Expected a SARIF 2.1.0 report with a runs array")
            else
              [
                .runs[] as $run |
                (
                  $run |
                  if type != "object" then
                    error("Expected each SARIF run to be an object")
                  elif has("results") and (.results | type) != "array" then
                    error("Expected SARIF results to be an array")
                  else
                    .results[]?
                  end
                ) as $finding |
                if ($finding | type) != "object" then
                  error("Expected each SARIF result to be an object")
                else
                  finding_rule($run; $finding) as $rule |
                  [
                    $finding.ruleId,
                    $finding.rule.id,
                    $finding.message.text,
                    $finding.message.markdown,
                    $rule.id,
                    ($rule.properties.tags // [])[],
                    ($rule.properties.aliases // [])[]
                  ][] |
                  strings |
                  scan("\\bCVE-[0-9]{4}-[0-9]{4,}\\b"; "i") |
                  ascii_upcase as $cve |
                  finding_properties($rule; $finding) as $properties |
                  {
                    cve: $cve,
                    package: reported_text($properties; "package"),
                    version: reported_text($properties; "package_version"),
                    fix_version: reported_text($properties; "recommended_fix_version")
                  }
                end
              ] | group_by(.cve) |
              if length == 0 then
                "No CVEs found in scan results."
              else
                "Detected CVEs (\(length) unique):",
                (
                  .[] |
                  "- \(.[0].cve)",
                  (
                    group_by([.package, .version])[] |
                    "  - Package: \(.[0].package // "Not reported")",
                    "    Detected version: \(.[0].version // "Not reported")",
                    "    Recommended fix version(s): \([.[].fix_version | select(. != null)] | unique | if length == 0 then "Not reported" else join(", ") end)"
                  )
                )
              end
            end
          ' "${sarif_file}"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: sarif-repository
          path: results.sarif
          if-no-files-found: warn

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: results.sarif
          category: repository

  # 4. Enumerate the build artifacts so the scan jobs below can fan out over
  #    them with a matrix. The reusable build workflow shares this run's id, so
  #    its uploaded artifacts are listable via the Actions API.
  discover-artifacts:
    name: Discover scan targets
    needs: [build]
    runs-on: ubuntu-latest
    if: github.repository == 'hashicorp/consul'
    outputs:
      binaries: ${{ steps.discover.outputs.binaries }}
      images: ${{ steps.discover.outputs.images }}
    steps:
      - name: List build artifacts
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Every artifact attached to this workflow run (binary zips, rpm/deb
          # packages, container image tarballs, and metadata).
          names=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[].name')
          echo "Run artifacts:"
          echo "${names}"

          # Binaries are the built zips (prefixed with consul_ to exclude metadata zips).
          zips=$(echo "${names}" | grep -E '^consul_.*\.zip$' || true)
          # Container images are the per-arch dev tarballs produced by
          # hashicorp/actions-docker-build.  The ".dockerbuild" metadata
          # artifacts are CRT-only; the ".docker.dev.tar" files are the actual
          # docker-save archives that can be loaded with `docker load`.
          tars=$(echo "${names}" | grep -E '\.docker\.dev\.tar$' || true)

          binaries=$(echo "${zips}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          images=$(echo "${tars}"  | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "binaries=${binaries}" >> "$GITHUB_OUTPUT"
          echo "images=${images}"     >> "$GITHUB_OUTPUT"

          echo "Discovered $(echo "${binaries}" | jq 'length') binaries and $(echo "${images}" | jq 'length') container images to scan."

  # 5. Scan each compiled binary -- one matrix job per binary artifact.
  scan-binaries:
    name: Scan ${{ matrix.artifact }}
    needs: [discover-artifacts, get-go-version]
    runs-on: ubuntu-latest
    # Needs the PRODSEC_SCANNER_READ_ONLY secret, so skip on forks.
    if: github.repository == 'hashicorp/consul' && needs.discover-artifacts.outputs.binaries != '[]'
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.discover-artifacts.outputs.binaries) }}
    steps:
      # Checkout gives the workspace a .git directory, which may be needed by
      # setup-go or the scanner when evaluating modules.
      - name: Checkout
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      # Download just this matrix entry's binary zip and unpack the binary into
      # a directory the scanner points at.
      - name: Download binary artifact
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ${{ matrix.artifact }}
          path: scan-target

      - name: Extract binary
        id: extract
        run: |
          set -euo pipefail
          cd scan-target
          unzip -o -j ./*.zip
          rm -f ./*.zip
          # Drop license/readme files so the scanner only sees the binary,
          # mirroring the skip list in the CRT scan-binary script.
          find . -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname '*.txt' -o -iname '*.md' -o -name 'LA_*' \) -delete
          echo "Binary staged for scanning:"
          ls -al
          binary_file=$(find . -maxdepth 1 -type f \( -name 'consul' -o -name 'consul.exe' \) | head -n 1)
          if [[ -z "${binary_file}" ]]; then
            echo "ERROR: No binary found after extraction"
            exit 1
          fi
          # Remove leading ./ from find output
          binary_file=${binary_file#./}
          echo "binary_path=scan-target/${binary_file}" >> "$GITHUB_OUTPUT"

      # hashicorp/security-scanner is private; check it out with a read-only
      # token and run it as a local action.
      - name: Clone Security Scanner repo
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          repository: hashicorp/security-scanner
          token: ${{ secrets.PRODSEC_SCANNER_READ_ONLY }}
          path: security-scanner
          ref: main

      - name: Scan binary
        id: scan
        uses: ./security-scanner
        with:
          sarif-profile: github
          fail-on-detection: true
          # Use `binary` input to analyze the binary unpacked in scan-target/
          binary: "${{ steps.extract.outputs.binary_path }}"
          config-path: .release/security-scan.hcl

      - *check-scan-results

      - *list-cves

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: sarif-binary-${{ matrix.artifact }}
          path: results.sarif
          if-no-files-found: warn

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: results.sarif
          category: binary-${{ matrix.artifact }}

  # 6. Scan each container image -- one matrix job per image tarball. Each job
  #    loads exactly one image into the local daemon and scans it.
  scan-containers:
    name: Scan ${{ matrix.artifact }}
    needs: [discover-artifacts, get-go-version]
    runs-on: ubuntu-latest
    # Needs the PRODSEC_SCANNER_READ_ONLY secret, so skip on forks.
    if: github.repository == 'hashicorp/consul' && needs.discover-artifacts.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.discover-artifacts.outputs.images) }}
    steps:
      # Checkout gives the workspace a .git directory.
      - name: Checkout
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      # Download just this matrix entry's image tarball.
      - name: Download image artifact
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: ${{ matrix.artifact }}
          path: scan-target

      # hashicorp/actions-docker-build stores each image as a `docker save`
      # tarball. Load this one into the local daemon so the scanner can inspect
      # it via local_daemon = true.
      - name: Load container image
        id: load
        run: |
          set -euo pipefail
          # actions/download-artifact extracts the artifact's contents into the
          # destination directory, so the tarball file is at scan-target/<name>
          # when the artifact was uploaded as a single file.  Use `find` as a
          # safety net in case the action nests it one level deeper.
          tarball=$(find scan-target -name '*.docker.dev.tar' -type f | head -n1)
          if [[ -z "${tarball}" ]]; then
            echo "ERROR: no .docker.dev.tar found under scan-target/"
            find scan-target -type f | sort
            exit 1
          fi
          echo "Loading ${tarball}"
          output=$(docker load -i "${tarball}")
          image_tag=$(echo "$output" | sed -n 's/^Loaded image: //p' | head -n 1)
          if [[ -z "${image_tag}" ]]; then
            echo "ERROR: Could not parse loaded image tag from docker load output."
            echo "Output was: ${output}"
            exit 1
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Loaded image tag: ${image_tag}"
          echo "Local images:"
          docker image ls

      - name: Prepare container scan configuration
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^container[[:space:]]*\{/ {
              print
              print "  local_daemon = true"
              found = 1
              next
            }
            { print }
            END {
              if (!found) {
                print "ERROR: no container block in .release/security-scan.hcl" > "/dev/stderr"
                exit 1
              }
            }
          ' .release/security-scan.hcl > "${RUNNER_TEMP}/security-scan.hcl"

      # hashicorp/security-scanner is private; check it out with a read-only
      # token and run it as a local action.
      - name: Clone Security Scanner repo
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          repository: hashicorp/security-scanner
          token: ${{ secrets.PRODSEC_SCANNER_READ_ONLY }}
          path: security-scanner
          ref: main

      - name: Scan container
        id: scan
        uses: ./security-scanner
        with:
          sarif-profile: github
          fail-on-detection: true
          container: "${{ steps.load.outputs.image_tag }}"
          config-path: ${{ runner.temp }}/security-scan.hcl

      - *check-scan-results

      - *list-cves

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: sarif-container-${{ matrix.artifact }}
          path: results.sarif
          if-no-files-found: warn

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          sarif_file: results.sarif
          category: container-${{ matrix.artifact }}
