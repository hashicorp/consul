# This action creates downstream PRs for PRs with backport labels defined.
# See docs here: https://github.com/hashicorp/backport-assistant

name: Backport Assistant Runner

on:
  pull_request_target:
    types:
      - closed
      - labeled
    branches:
      - main
      - 'release/*.*.x'

jobs:
  backport:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    container: hashicorpdev/backport-assistant:v0.5.8
    steps:
      - name: Run Backport Assistant for release branches
        run: |
          backport-assistant backport -merge-method=squash
        env:
          BACKPORT_LABEL_REGEXP: "backport/(?P<target>\\d+\\.\\d+)"
          BACKPORT_TARGET_TEMPLATE: "release/{{.target}}.x"
          BACKPORT_MERGE_COMMIT: true
          GITHUB_TOKEN: ${{ secrets.ELEVATED_GITHUB_TOKEN_WORKFLOW }}
          ENABLE_VERSION_MANIFESTS: true
  backport-ent:
    if: github.event.pull_request.merged && contains(join(github.event.pull_request.labels.*.name), 'backport/ent')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backport for Enterprise
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.ELEVATED_GITHUB_TOKEN }}
          repository: hashicorp/consul-enterprise
          event-type: ent-backport
          client-payload: ${{ toJson(github.event) }}
  # backport-assistant does not copy labels, so carry the ENT sync opt-out over to the CE backport PRs.
  propagate-no-ent-sync:
    needs: backport
    if: always() && github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'pr/no-ent-sync')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add pr/no-ent-sync to backport PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          backport_prs=$(gh pr list -R "$REPO" --state open --limit 1000 --json number,headRefName,body |
            jq -r --arg prefix "backport/${SOURCE_BRANCH}/" --arg marker "auto-generated from #${PR_NUMBER} " \
              '.[] | select((.headRefName | startswith($prefix)) and (.body | contains($marker))) | .number')
          if [[ -z "$backport_prs" ]]; then
            echo "No open backport PRs found for #${PR_NUMBER}"
            exit 0
          fi
          for pr in $backport_prs; do
            echo "Adding pr/no-ent-sync to #${pr}"
            gh pr edit "$pr" -R "$REPO" --add-label "pr/no-ent-sync"
          done
  handle-failure:
    needs:
      - backport
      - backport-ent
    if: always() && (needs.backport.result == 'failure' || needs.backport-ent.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR
        run: |
          github_message="Backport failed @${{ github.event.sender.login }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -H "Authorization: token ${{ secrets.PR_COMMENT_TOKEN }}" \
            -X POST \
            -d "{ \"body\": \"${github_message}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments"

