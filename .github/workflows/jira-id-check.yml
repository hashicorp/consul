###############################################################################
# jira-id-check.yml
#
# Prevents internal Jira ticket IDs from leaking into the CE (community
# edition) repository via pull request descriptions or changed source files.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Why this check exists                                                  │
# │                                                                         │
# │  Internal employees filing CE PRs may inadvertently include Jira IDs   │
# │  (e.g. CCT-123, NET-456) in the PR body or in code comments. These     │
# │  IDs are internal tracking references that are meaningless to the       │
# │  community and constitute a minor information disclosure (project key   │
# │  names, issue existence, internal roadmap visibility).                  │
# │                                                                         │
# │  This workflow enforces a hard rule:                                    │
# │    • No Jira ID in the PR description                                   │
# │    • No Jira ID introduced in any changed source / config file          │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Scope:
#   Runs ONLY on PRs authored by internal employees: author_association of
#   OWNER, MEMBER, or COLLABORATOR.  External contributors cannot have
#   access to internal Jira, so scanning their PRs would only produce false
#   positives (coincidental uppercase-letter + digit sequences).
#
#   Dependabot PRs are explicitly excluded (version-bump descriptions never
#   contain Jira IDs).
#
# Enforcement model:
#   Detection  — runs on ALL such pull requests.
#   Merge-blocking — enforced on protected branches (main, release/**)
#     via GitHub's required-status-checks.  The job is intentionally
#     non-blocking on feature-branch PRs so engineers can self-serve, but a
#     Slack alert fires immediately for visibility.
#
# Relationship to ent-protection.yml:
#   ent-protection.yml  — checks for ENT code / file paths in CE.
#   jira-id-check.yml   — checks for internal tracking metadata in CE.
#   These are complementary; run them both.
#
###############################################################################

name: Jira ID Check

on:
  pull_request:
    # No branch filter — runs on ALL pull requests regardless of target branch.
    # On PRs targeting protected branches (main, release/**) the failed status
    # check prevents merging. On PRs targeting feature branches the failure is
    # visible and the Slack alert fires for rapid remediation.
    types:
      - opened
      - synchronize
      - reopened
      - edited   # Re-run when the PR description is edited

permissions:
  contents: read

env:
  # Protected branches where a failed check hard-blocks merging.
  PROTECTED_BRANCH_REGEX: '^(main|release/.+)$'
  # Hoist the secret into env so it can be referenced from step conditionals.
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  jira-id-check:
    name: Check for Internal Jira IDs
    runs-on: ubuntu-latest
    # Skip Dependabot PRs (version bumps only) and limit scanning to authors
    # who could have internal Jira access: repository owners (OWNER), HashiCorp
    # org members (MEMBER), and invited collaborators (COLLABORATOR).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')

    steps:
      - name: Checkout CE repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history required to diff the PR against its base SHA.
          fetch-depth: 0

      # ─── Compute the set of files changed in this PR ──────────────────────
      - name: Compute PR file scope
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"

          echo "Computing PR file scope between ${BASE_SHA} and ${HEAD_SHA}" >&2
          # Include added, copied, modified, and renamed files only.
          # Deletions cannot introduce new Jira IDs.
          git diff --name-only --diff-filter=ACMR "${BASE_SHA}" "${HEAD_SHA}" \
            > /tmp/pr-files.txt 2>/dev/null || true

          echo "PR file count: $(wc -l < /tmp/pr-files.txt)" >&2
          cat /tmp/pr-files.txt >&2 || true

      # ─── Classify the target branch ───────────────────────────────────────
      - name: Classify branch protection level
        id: branch-type
        run: |
          BRANCH="${{ github.event.pull_request.base.ref }}"
          if [[ "$BRANCH" =~ ${{ env.PROTECTED_BRANCH_REGEX }} ]]; then
            echo "protected=true"  >> "$GITHUB_OUTPUT"
            echo "PR targets PROTECTED branch '${BRANCH}' — merge-blocking enforcement active."
          else
            echo "protected=false" >> "$GITHUB_OUTPUT"
            echo "PR targets non-protected branch '${BRANCH}' — detection+alert mode."
          fi

      # ─── Run the Jira ID check ────────────────────────────────────────────
      # Checks both surfaces in one pass:
      #   • PR description  (via JIRA_CHECK_PR_BODY env var)
      #   • Changed files   (via /tmp/pr-files.txt positional arg)
      #
      # The script exits 1 when any Jira ID is found, which fails this step
      # and (on protected branches) blocks the merge via required-status-checks.
      - name: Scan for Jira IDs in PR description and changed files
        id: jira-id-scan
        env:
          # Pass the raw PR body text via env to avoid shell-quoting issues with
          # arbitrary user content. The script reads it as ${JIRA_CHECK_PR_BODY}.
          JIRA_CHECK_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          chmod +x .github/scripts/check-jira-ids.sh
          .github/scripts/check-jira-ids.sh /tmp/pr-files.txt \
            2>&1 | tee /tmp/jira-id-scan-output.txt
          exit ${PIPESTATUS[0]}

      # ─── Slack alert for violations on non-protected branches ─────────────
      # On protected branches the required-status-check merge block is the
      # primary signal. On feature branches the check still fails visibly in
      # the PR, but a Slack alert to #feed-consul-hygiene-alerts
      # (id: C0BB6F78VB4) fires so the team can follow up with the author
      # before the PR targets a protected branch.
      - name: Alert Slack on Jira ID violation
        if: failure() && steps.branch-type.outputs.protected == 'false' && env.SLACK_WEBHOOK_URL != ''
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          ACTOR:       ${{ github.actor }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY=$(grep '::error::' /tmp/jira-id-scan-output.txt 2>/dev/null \
            | head -5 \
            | sed 's/::error::[^:]*:://' \
            | sed 's/^/• /' \
            || echo "(see CI log)")
          PAYLOAD=$(jq -cn \
            --arg summary ":lock: *Internal Jira IDs detected in CE PR*" \
            --arg detail "$(printf ':lock: *Internal Jira IDs found in <%s>*\nPR branch: *%s* → *%s*  |  Actor: *%s*\n\n%s\n\n<%s|View PR> — <%s|View CI run>\n\nPlease remove internal ticket references from the PR description and source files.' \
              "${{ github.repository }}" "$HEAD_BRANCH" "$BASE_BRANCH" "$ACTOR" "$SUMMARY" "$PR_URL" "$RUN_URL")" \
            '{"text":$summary,"blocks":[{"type":"section","text":{"type":"mrkdwn","text":$detail}}]}')
          curl -fsSL -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
